packages:
  - apps/*
  - packages/*
# Only versions published at least 14 days ago resolve (20160 minutes). A security fix that cannot wait goes in
# minimumReleaseAgeExclude with the advisory id in a comment.
minimumReleaseAge: 20160
# next 16.4.1: GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr (through better-auth > next, unused here).
minimumReleaseAgeExclude:
  - next@16.4.1
allowBuilds:
  esbuild: true
  sharp: true
  msgpackr-extract: true
  workerd: true
# seroval comes in through better-auth > solid-js (unused here); 1.5.x has GHSA-jp82-f5mq-hwhp and a critical
# fromJSON advisory. next comes in through better-auth > next (unused here; the web app uses vinext).
overrides:
  next: 16.4.1
  seroval: 1.6.3
  seroval-plugins: 1.6.3
catalog:
  zod: ^4.5.4
  typescript: ^6.0.3
  "@types/node": ^26.4.1
  varlock: 1.21.1
  "@cloudflare/workers-types": ^5.20260906.1
  "@trpc/server": ^11.19.0
  better-auth: 1.7.7
  evlog: ^2.30.0
  lucide-react: ^1.41.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.8
  "@trpc/client": ^11.19.0
  "@tailwindcss/postcss": ^4.3.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  tailwindcss: ^4.3.3
  drizzle-orm: 1.0.0-rc.4
